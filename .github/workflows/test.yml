name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install pytest PyQt5 textual
      - run: QT_QPA_PLATFORM=offscreen PYTHONPATH=src pytest tests/test_dx_pinshot.py -v
